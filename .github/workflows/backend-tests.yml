name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03.src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 03.src/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest ../../04.test/backend --cov=app --cov-report=term-missing --cov-fail-under=95
